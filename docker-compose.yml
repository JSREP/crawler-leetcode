version: '3.8'

services:
  # Flask后端应用
  app:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: crawler-leetcode-app
    ports:
      - "57523:57523"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - SECRET_KEY=your-production-secret-key-here
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=crawler_user
      - MYSQL_PASSWORD=crawler_password
      - MYSQL_DATABASE=crawler_leetcode
      - JWT_SECRET_KEY=your-jwt-secret-key-here
      - UPLOAD_FOLDER=/app/storage
      - CORS_ORIGINS=http://localhost:57524,https://yourdomain.com
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - crawler-network

  # MySQL数据库
  db:
    image: mysql:8.0
    container_name: crawler-leetcode-db
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=crawler_leetcode
      - MYSQL_USER=crawler_user
      - MYSQL_PASSWORD=crawler_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    ports:
      - "3306:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - crawler-network

  # Redis缓存（可选）
  redis:
    image: redis:7-alpine
    container_name: crawler-leetcode-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - crawler-network

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: crawler-leetcode-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-available:/etc/nginx/sites-available:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./backend/storage:/var/www/storage:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - crawler-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  crawler-network:
    driver: bridge
